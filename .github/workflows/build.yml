name: Build & Deploy to Minikube

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  deploy:
    name: Full Deploy
    runs-on: self-hosted
    steps:
      # 1. Получаем код
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Проверяем и при необходимости запускаем Minikube
      - name: Start Minikube if not running
        run: |
          $status = minikube status --format "{{.Host}}" 2>$null
          if ($status -ne "Running") {
            Write-Host "Minikube is not running. Starting..."
            minikube start --driver=docker
            minikube addons enable ingress
          } else {
            Write-Host "Minikube is already running."
          }
        shell: powershell

      # 2. Переключаем Docker на демон Minikube (надёжная версия)
      - name: Switch to Minikube Docker daemon
        run: |
          $envOutput = minikube docker-env --shell powershell
          $envLines = $envOutput -split "`r?`n" | Where-Object { $_ -match '^\$Env:' }
          if ($envLines) {
              $envLines -join "`n" | Invoke-Expression
              Write-Host "Switched to Minikube Docker daemon"
              # Проверяем, что теперь работаем с Minikube
              docker info --format '{{ .Name }}' | Select-String "minikube"
          } else {
              Write-Error "Failed to switch Docker daemon. Output: $envOutput"
              exit 1
          }
        shell: powershell

      # 3. Сборка образов backend – теперь сразу в Minikube
      - name: Build backend images (inside Minikube)
        run: |
          cd backend
          docker compose build
        shell: powershell

      # 4. Сборка frontend – также в Minikube
      - name: Build frontend image (inside Minikube)
        run: |
          cd frontend
          docker compose build
        shell: powershell

      # 6. Создание ConfigMap со скриптами инициализации БД
      - name: Create init-sql ConfigMaps
        run: |
          kubectl create configmap db-configmap-bonusdb --from-file=backend/bonus_service/sql/init_db.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap db-configmap-flightdb --from-file=backend/flight_service/sql/init_db.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap db-configmap-ticketdb --from-file=backend/ticket_service/sql/init_db.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap db-configmap-authdb --from-file=backend/auth_service/sql/init_db.sql --dry-run=client -o yaml | kubectl apply -f -
#          kubectl create configmap db-configmap-statisticsdb --from-file=backend/statistics_service/sql/init_db.sql --dry-run=client -o yaml | kubectl apply -f -

        shell: powershell

      # 7. Удаляем старый релиз Kafka, если он остался (чтобы не было конфликта имён)
      - name: Remove old Kafka release if present
        run: |
          if (helm list -q | Select-String -Pattern '^kafka$') {
            Write-Host "Removing old Kafka release..."
            helm uninstall kafka
          }
        shell: powershell

      # 8. Деплой баз данных через postgres-chart
      - name: Deploy PostgreSQL databases
        run: |
          helm upgrade --install db ./k8s/postgres-chart `
            -f ./k8s/postgres-chart/values.yaml `
            --wait --timeout 10m
        shell: powershell

      # 9. Деплой микросервисов и фронтенда через app-chart
      - name: Deploy application services
        run: |
          helm upgrade --install my-app ./k8s/app-chart `
            -f ./k8s/app-chart/values.yaml `
            --wait --timeout 15m
        shell: powershell

      # 10. Запуск minikube tunnel в фоне, чтобы Ingress отвечал на localhost
      - name: Start minikube tunnel
        run: |
          Start-Process -NoNewWindow powershell -ArgumentList "minikube tunnel"
          Start-Sleep -Seconds 15
        shell: powershell

      # 11. Ожидание, пока все поды станут Ready
      - name: Wait for all pods
        run: kubectl wait --for=condition=ready pod --all --timeout=300s
        shell: powershell

      # 12. Диагностика при сбое
      - name: Debug on failure
        if: failure()
        run: |
          Write-Host "=== Pods ==="
          kubectl get pods
          Write-Host "=== Describe pods ==="
          kubectl describe pods
          Write-Host "=== Logs (last 50 lines) ==="
          kubectl logs --all-containers=true --tail=50 --selector app.kubernetes.io/part-of=simple-backend
        shell: powershell