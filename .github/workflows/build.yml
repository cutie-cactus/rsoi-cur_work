name: Build & Deploy to Yandex Cloud

on:
 workflow_dispatch:
 push:
   branches: [ master ]
 pull_request:
   branches: [ master ]

env:
 REGISTRY_ID: ${{ vars.REGISTRY_ID }}          # ID Container Registry
 K8S_CLUSTER_ID: ${{ vars.K8S_CLUSTER_ID }}    # ID Managed Kubernetes кластера
 FOLDER_ID: ${{ vars.FOLDER_ID }}

jobs:
 deploy:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
       with:
         fetch-depth: 0

     # Шаг 1 – только установка yc и добавление в PATH
     - name: Install yc CLI
       run: |
         curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
         echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
       shell: bash

     # Шаг 2 – настройка профиля и Docker (yc уже доступен)
     - name: Configure yc and Docker
       run: |
         cat > key.json <<'EOFJSON'
         ${{ secrets.YANDEX_CLOUD_SA_KEY }}
         EOFJSON
         yc config profile create sa-profile
         yc config set service-account-key key.json
         yc config set folder-id ${{ vars.FOLDER_ID }}
         yc container registry configure-docker
       shell: bash

    #  # 3. Сборка и публикация backend-образов
     - name: Build and push backend images
       run: |
         cd backend
         docker build --no-cache -t cr.yandex/${{ env.REGISTRY_ID }}/bonus-service:latest -f ./docker/bonus.Dockerfile .
         docker build --no-cache -t cr.yandex/${{ env.REGISTRY_ID }}/flight-service:latest -f ./docker/flight.Dockerfile .
         docker build --no-cache -t cr.yandex/${{ env.REGISTRY_ID }}/ticket-service:latest -f ./docker/ticket.Dockerfile .
         docker build --no-cache -t cr.yandex/${{ env.REGISTRY_ID }}/auth-service:latest -f ./docker/auth.Dockerfile .
         docker build --no-cache -t cr.yandex/${{ env.REGISTRY_ID }}/gateway-service:latest -f ./docker/gateway.Dockerfile .
         docker build --no-cache -t cr.yandex/${{ env.REGISTRY_ID }}/statistics-service:latest -f ./docker/statistics.Dockerfile .
         docker build --no-cache -t cr.yandex/${{ env.REGISTRY_ID }}/consumer-service:latest -f ./docker/consumer.Dockerfile .

         docker push cr.yandex/${{ env.REGISTRY_ID }}/bonus-service:latest
         docker push cr.yandex/${{ env.REGISTRY_ID }}/flight-service:latest
         docker push cr.yandex/${{ env.REGISTRY_ID }}/ticket-service:latest
         docker push cr.yandex/${{ env.REGISTRY_ID }}/auth-service:latest
         docker push cr.yandex/${{ env.REGISTRY_ID }}/gateway-service:latest
         docker push cr.yandex/${{ env.REGISTRY_ID }}/statistics-service:latest
         docker push cr.yandex/${{ env.REGISTRY_ID }}/consumer-service:latest

    #  # 4. Сборка и публикация frontend-образа
    #  # Важно: кроме latest публикуем тег с SHA коммита.
    #  # Так Kubernetes точно увидит новый образ клиента, а не продолжит использовать старый latest.
     - name: Build and push frontend image
       run: |
         cd frontend
         docker build --no-cache \
           -t cr.yandex/${{ env.REGISTRY_ID }}/dips-client:latest \
           -t cr.yandex/${{ env.REGISTRY_ID }}/dips-client:${GITHUB_SHA} \
           .
         docker push cr.yandex/${{ env.REGISTRY_ID }}/dips-client:latest
         docker push cr.yandex/${{ env.REGISTRY_ID }}/dips-client:${GITHUB_SHA}

     # 5. Получение kubeconfig для кластера
     - name: Get k8s credentials
       run: |
         yc managed-kubernetes cluster get-credentials ${{ env.K8S_CLUSTER_ID }} --external --force

     # 6. ConfigMap'ы со скриптами инициализации БД
     - name: Create init-sql ConfigMaps
       run: |

         kubectl delete deployment my-app-bonus-service-dep my-app-flight-service-dep my-app-ticket-service-dep my-app-auth-service-dep my-app-statistics-service-dep my-app-consumer-service-dep my-app-gateway-service-dep my-app-dips-client-dep
#          kubectl delete deployment authdb bonusdb flightdb ticketdb statisticsdb

     - name: Force unlock db release
       run: |
         echo "Deleting Helm secrets for release 'db'..."
         kubectl delete secret -l owner=helm,name=db --ignore-not-found
         echo "Attempting to uninstall any lingering release..."
         helm uninstall db --ignore-not-found 2>/dev/null || true
         echo "Release lock cleared."
       shell: bash

     # 7. Удаление старого релиза Kafka (если есть)
     - name: Remove old Kafka release if present
       run: |
         if helm list -q | grep -q '^kafka$'; then
           echo "Removing old Kafka release..."
           helm uninstall kafka
         fi

     # 8. Деплой баз данных (postgres-chart)
     - name: Deploy PostgreSQL databases
       run: |
         helm upgrade --install db ./k8s/postgres-chart \
           -f ./k8s/postgres-chart/values.yaml \
           --wait --timeout 10m

     - name: Force unlock my-app release
       run: |
         echo "Deleting Helm secrets for release 'my-app'..."
         kubectl delete secret -l owner=helm,name=my-app --ignore-not-found
         echo "Attempting to uninstall any lingering release..."
         helm uninstall my-app --ignore-not-found 2>/dev/null || true
         echo "Release lock cleared."
       shell: bash

     # 9. Деплой приложения с переопределением образа frontend
     # Без этого chart может брать старый образ из values.yaml или не менять pod, если тег latest не изменился в spec.
     - name: Deploy application services
       run: |
         helm upgrade --install my-app ./k8s/app-chart \
           -f ./k8s/app-chart/values.yaml \
           --set services.dips-client.container=cr.yandex/${{ env.REGISTRY_ID }}/dips-client:${GITHUB_SHA} \
           --wait --timeout 15m

     # 10. Применяем Ingress правила
     - name: Apply Ingress rules
       run: kubectl apply -f k8s/app-chart/templates/Ingress.yaml

     # 11. Ожидание готовности всех подов
     - name: Wait for all pods
       run: kubectl wait --for=condition=ready pod --all --timeout=300s


     # 12. Автоматическое наполнение демонстрационными данными
     # SQL-файлы находятся в репозитории в database_seed/.
     # Runner после деплоя стримит их через kubectl exec прямо в PostgreSQL pod'ы.
     - name: Seed demo database data
       run: |
         chmod +x database_seed/00_seed_all.sh
         ./database_seed/00_seed_all.sh
       shell: bash

     # 13. Диагностика при сбое
     - name: Debug on failure
       if: failure()
       run: |
         echo "=== Pods ==="
         kubectl get pods
         echo "=== Describe pods ==="
         kubectl describe pods
         echo "=== Logs (last 50 lines) ==="
         kubectl logs --all-containers=true --tail=50 --selector app.kubernetes.io/part-of=simple-backend || true
