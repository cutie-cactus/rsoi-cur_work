apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /api/v1/user
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8888

          - path: /api/v1/statistics
            pathType: Prefix
            backend:
              service:
                name: statistics-service
                port:
                  number: 8090

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: dips-client
                port:
                  number: 80